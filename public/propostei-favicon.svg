<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Propostei favicon</title>
  <desc id="desc">Ícone da marca Propostei com um P estilizado e check branco sobre fundo em gradiente verde-azulado.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6EF2D0"/>
      <stop offset="0.45" stop-color="#00AFAF"/>
      <stop offset="1" stop-color="#007E8A"/>
    </linearGradient>
    <linearGradient id="shine" x1="106" y1="72" x2="388" y2="346" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00383D" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="48" y="48" width="416" height="416" rx="104" fill="url(#bg)" filter="url(#softShadow)"/>
  <rect x="48" y="48" width="416" height="416" rx="104" fill="url(#shine)"/>

  <!-- P estilizado -->
  <path d="M148 134C148 122.954 156.954 114 168 114H285C357 114 408 159 408 222C408 284 357 329 285 329H228V398C228 408.15 220.941 416.955 211.033 419.176L172.033 427.919C159.55 430.717 148 421.219 148 408.426V134ZM228 194V253H284C308.5 253 326 241 326 222.5C326 204 308.5 194 284 194H228Z" fill="white"/>

  <!-- Check integrado, simplificado para legibilidade em favicon -->
  <path d="M181 278C174.5 271.5 174.5 260.9 181 254.4L203.4 232C209.9 225.5 220.5 225.5 227 232L267 272L370 169C376.5 162.5 387.1 162.5 393.6 169L416 191.4C422.5 197.9 422.5 208.5 416 215L279 352C272.5 358.5 261.9 358.5 255.4 352L181 278Z" fill="white"/>

  <!-- sombra interna sutil do check para separar em tamanhos maiores -->
  <path d="M227 232L267 272L370 169C376.5 162.5 387.1 162.5 393.6 169L398 173.4L267 304L218 255L227 232Z" fill="#DFFCF4" fill-opacity="0.38"/>
</svg>
